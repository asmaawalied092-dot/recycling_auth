<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - نظام إعادة التدوير</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .phone-frame {
            width: 380px;
            height: 720px;
            background: white;
            border-radius: 40px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 8px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            box-sizing: border-box;
            position: relative;
        }
        h2 {
            font-size: 28px;
            color: #111;
            margin-bottom: 25px;
            font-weight: 700;
        }
        .input-group {
            position: relative;
            margin-bottom: 15px;
        }
        .input-group input {
            width: 100%;
            padding: 14px 40px;
            background-color: #f7f7f7;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        .input-group input:focus {
            border-color: #ff5c5c;
            background-color: #fff;
        }
        .input-group .icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
        }
        .terms {
            font-size: 11px;
            color: #777;
            margin: 15px 0 20px 0;
            line-height: 1.5;
        }
        .terms span {
            color: #ff5c5c;
        }
        .btn-create {
            width: 100%;
            padding: 14px;
            background-color: #ff5c5c;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-create:hover {
            background-color: #e04b4b;
        }
        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <h2>Create an<br>account</h2>

        <form id="registerForm">
            <div class="input-group">
                <span class="icon">👤</span>
                <input type="text" id="username" placeholder="Username or Email" required>
            </div>

            <div class="input-group">
                <span class="icon">🔒</span>
                <input type="password" id="password" placeholder="Password" required>
            </div>

            <div class="input-group">
                <span class="icon">🔒</span>
                <input type="password" id="confirm_password" placeholder="Confirm Password" required>
            </div>

            <div class="terms">
                By clicking the <span>Register</span> button, you agree to the public offer
            </div>

            <button type="submit" class="btn-create">Create Account</button>
        </form>

        <div id="responseMessage" class="message"></div>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        const responseMsg = document.getElementById('responseMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirm_password = document.getElementById('confirm_password').value;

            responseMsg.style.color = '#555';
            responseMsg.innerText = 'جاري إرسال البيانات...';

            try {
                const response = await fetch('http://127.0.0.1:8000/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.FromString ? JSON.stringify({ username, password, confirm_password }) : JSON.stringify({ username, password, confirm_password })
                });

                const data = await response.json();

                if (response.ok) {
                    responseMsg.style.color = 'green';
                    responseMsg.innerText = '✅ ' + data.message;
                } else {
                    responseMsg.style.color = 'red';
                    responseMsg.innerText = '❌ ' + (data.detail || 'حدث خطأ ما');
                }
            } catch (error) {
                responseMsg.style.color = 'red';
                responseMsg.innerText = '❌ تعذر الاتصال بالسيرفر المحلي!';
            }
        });
    </script>
</body>
</html>
